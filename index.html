<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Library - Masterpiece Edition</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* 🌟 CSS Variables */
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.9);
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #3b82f6; 
            --accent-glow: rgba(59, 130, 246, 0.15);
            --shadow-soft: 0 8px 20px rgba(0, 0, 0, 0.05);
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --canvas-filter: none;
        }

        /* 🌙 OLED Dark */
        [data-theme="dark"] {
            --bg-main: #000000;
            --bg-card: #111111;
            --bg-header: rgba(10, 10, 10, 0.85);
            --border-color: #222222;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #60a5fa;
            --shadow-soft: 0 4px 20px rgba(255,255,255,0.02);
        }

        /* 🎨 Paper Cut */
        [data-theme="papercut"] {
            --bg-main: #f4f0ec;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.9);
            --border-color: #d7d3c8;
            --text-main: #2c2a25;
            --text-muted: #797569;
            --accent: #d97757;
            --shadow-soft: 4px 4px 0px rgba(0,0,0,0.06); 
        }

        /* 📱 iPhone iOS */
        [data-theme="iphone"] {
            --bg-main: #f2f2f7;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.8);
            --border-color: transparent;
            --text-main: #000000;
            --text-muted: #8e8e93;
            --accent: #007aff;
            --shadow-soft: 0 2px 12px rgba(0,0,0,0.04);
        }

        [data-font="default"] { --font-family: 'Plus Jakarta Sans', sans-serif; }
        [data-font="serif"] { --font-family: 'Merriweather', serif; }
        [data-font="mono"] { --font-family: 'Courier New', Courier, monospace; }
        
        .sepia-mode { --canvas-filter: sepia(0.55) contrast(0.95) brightness(0.9) !important; }
        [data-theme="dark"] .dark-reader-mode { --canvas-filter: invert(1) hue-rotate(180deg) contrast(0.9) brightness(0.8) !important; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); transition: background 0.3s, border-color 0.3s; }
        body { background: var(--bg-main); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        /* --- Header --- */
        .header-container { 
            max-width: 1050px; margin: 20px auto; padding: 12px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-header); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft); position: sticky; top: 15px; z-index: 50;
        }
        .header-title { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; }
        .header-title i { color: var(--accent); font-size: 26px; }
        
        .tabs { display: flex; gap: 10px; background: var(--bg-main); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tab-btn { padding: 6px 14px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--bg-card); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .search-box { position: relative; width: 200px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
        .search-box input { width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px 8px 36px; border-radius: 10px; outline: none; font-size: 13px; font-weight: 500; }
        
        .global-settings-btn { background: var(--bg-main); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-main); cursor: pointer; }

        /* Dropdowns */
        .dropdown { display: none; position: absolute; right: 0; top: calc(100% + 8px); background: var(--bg-card); backdrop-filter: blur(15px); border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); padding: 10px; z-index: 100; min-width: 240px; border: 1px solid var(--border-color); }
        .dropdown-header { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 4px 6px; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; display: flex; align-items: center; justify-content: space-between; gap: 6px;}
        .dropdown-item { padding: 8px 10px; font-size: 13px; color: var(--text-main); border-radius: 8px; transition: 0.15s; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .dropdown-item:hover { background: var(--bg-main); cursor: pointer; }
        select.settings-select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); outline: none; cursor: pointer; margin-top: 4px;}

        /* --- Hero Banner (Continue Reading) --- */
        .hero-banner {
            max-width: 1050px; margin: 20px auto 0 auto; padding: 0 20px; display: none;
            animation: fadeIn 0.5s ease;
        }
        .hero-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-main));
            border: 1px solid var(--border-color); border-radius: 20px; padding: 20px 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: var(--shadow-soft); cursor: pointer; transition: 0.3s;
        }
        .hero-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 25px var(--accent-glow); }
        .hero-info { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .hero-tag { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }
        .hero-title { font-size: 18px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-progress { width: 100%; height: 6px; background: rgba(0,0,0,0.05); border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .hero-fill { height: 100%; background: var(--accent); border-radius: 4px; width: 0%; }
        .hero-play-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; box-shadow: 0 5px 15px var(--accent-glow); }

        /* --- Grid --- */
        .library-grid { max-width: 1050px; margin: 30px auto 60px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; position: relative; cursor: pointer; box-shadow: var(--shadow-soft); transition: 0.3s; display: flex; flex-direction: column; gap: 10px; }
        .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 12px 24px var(--accent-glow); }
        .card-cover { width: 100%; aspect-ratio: 2/3; background: var(--bg-main); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid var(--border-color); }
        .card-cover canvas { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
        .card-cover canvas.loaded { opacity: 1; }
        .fav-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.3s; z-index: 10; border: 1px solid rgba(255,255,255,0.2); filter: grayscale(100%); opacity: 0.7; }
        .fav-btn:hover { opacity: 1; transform: scale(1.1); }
        .fav-btn.active { filter: grayscale(0%); opacity: 1; background: rgba(255, 120, 0, 0.2); border-color: #ff7800; transform: scale(1.1); }
        .card-info { padding: 4px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 14px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; margin-bottom: 8px; }
        .progress-wrapper { margin-top: auto; }
        .progress-text { font-size: 10px; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .progress-bar { width: 100%; height: 6px; background: var(--bg-main); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; }

        /* --- PDF Viewer --- */
        #viewer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-main); z-index: 1000; flex-direction: column; }
        
        .viewer-header { background: var(--bg-card); height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: var(--shadow-soft); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-action:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-close { background: rgba(225, 29, 72, 0.1); color: #e11d48; border-color: transparent; }
        .btn-close:hover { background: #e11d48; color: white; }

        /* Floating Bottom Nav */
        .bottom-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; z-index: 1050;
        }
        .btn-control { background: var(--bg-main); border: none; color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; border: 1px solid var(--border-color); }
        .btn-control:hover { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px var(--accent-glow); }
        .page-info { font-size: 13px; font-weight: 700; min-width: 70px; text-align: center; }

        /* Focus Mode (Hides UI) */
        .focus-mode .viewer-header { transform: translateY(-100%); }
        .focus-mode .bottom-nav { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }

        .canvas-container { flex-grow: 1; overflow: auto; padding: 20px 0; text-align: center; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; gap: 20px; touch-action: pan-y; cursor: pointer; }
        .canvas-container.swipe-mode { touch-action: pan-x pan-y; }
        .pdf-page-canvas { background: white; box-shadow: 0 8px 25px rgba(0,0,0,0.12); filter: var(--canvas-filter); transition: filter 0.3s; max-width: 100%; cursor: default; }

        /* Outline / Chapters Sidebar */
        #outline-container { max-height: 250px; overflow-y: auto; background: var(--bg-main); border-radius: 10px; margin-top: 10px; padding: 5px; display: none; }
        .outline-item { font-size: 12px; padding: 8px 10px; color: var(--text-main); border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display:block; }
        .outline-item:hover { background: var(--bg-card); color: var(--accent); font-weight: 600; }
        .outline-item.no-chapters { color: var(--text-muted); cursor: default; font-style: italic; }

        .msg-text { text-align: center; margin-top: 80px; font-size: 16px; font-weight: 600; grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-muted); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        @media (max-width: 900px) { .library-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 650px) { .library-grid { grid-template-columns: repeat(2, 1fr); } .header-container { flex-wrap: wrap; gap: 15px; } .tabs { width: 100%; justify-content: center; order: 3; } }
        @media (max-width: 450px) { .library-grid { grid-template-columns: 1fr; } .hero-card { flex-direction: column; align-items: flex-start; text-align: left; } .hero-play-btn { align-self: flex-end; margin-top: -30px; } }
    </style>
</head>
<body data-theme="default" data-font="default">

    <!-- Header -->
    <div class="header-container">
        <div class="header-title"><i class="ph-duotone ph-books"></i> Library</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all', this)">All Books</button>
            <button class="tab-btn" onclick="switchTab('fav', this)">Favorites 🎃</button>
        </div>
        <div style="display:flex; gap: 10px; position:relative;">
            <div class="search-box">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search..." onkeyup="filterPDFs()">
            </div>
            <button class="global-settings-btn" onclick="toggleMenu(event, 'settings-menu')"><i class="ph-bold ph-gear"></i></button>
            
            <!-- Global Settings Menu -->
            <div class="dropdown" id="settings-menu">
                <!-- Reading Stats -->
                <div class="dropdown-header">
                    <span><i class="ph-bold ph-chart-bar"></i> Reading Stats</span>
                    <span id="reading-time-badge" style="color:var(--accent); font-size:10px;">0 mins</span>
                </div>

                <!-- 🌟 History Section Brought Back! -->
                <div class="dropdown-header" style="margin-top: 10px;"><i class="ph-bold ph-clock-counter-clockwise"></i> Recently Read</div>
                <div id="recent-book-container"></div>
                
                <!-- Appearance Settings -->
                <div class="dropdown-header" style="margin-top: 10px;"><i class="ph-bold ph-palette"></i> Appearance</div>
                <div class="dropdown-item" onclick="event.stopPropagation()" style="display:flex; flex-direction:column; align-items:flex-start;">
                    <label style="font-size:11px; font-weight:600; color:var(--text-muted);">THEME</label>
                    <select class="settings-select" id="theme-select" onchange="changeTheme(this.value)">
                        <option value="default">Light White</option>
                        <option value="dark">OLED Dark (Night)</option>
                        <option value="papercut">Paper Cut (Minimal)</option>
                        <option value="iphone">iPhone iOS (Clean)</option>
                    </select>
                </div>
                <div class="dropdown-item" onclick="event.stopPropagation()" style="display:flex; flex-direction:column; align-items:flex-start;">
                    <label style="font-size:11px; font-weight:600; color:var(--text-muted);">FONT</label>
                    <select class="settings-select" id="font-select" onchange="changeFont(this.value)">
                        <option value="default">Jakarta (Modern)</option>
                        <option value="serif">Merriweather (Classic)</option>
                        <option value="mono">Courier (Typewriter)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 Hero Banner: Jump Back In -->
    <div class="hero-banner" id="hero-banner">
        <div class="hero-card" onclick="resumeLastBook()">
            <div class="hero-info">
                <div class="hero-tag"><i class="ph-bold ph-play-circle"></i> Continue Reading</div>
                <div class="hero-title" id="hero-title">Book Name</div>
                <div class="progress-text" style="margin-top:4px;"><span id="hero-status">Page X of Y</span></div>
                <div class="hero-progress"><div class="hero-fill" id="hero-fill"></div></div>
            </div>
            <div class="hero-play-btn"><i class="ph-fill ph-book-open"></i></div>
        </div>
    </div>

    <!-- Book Grid -->
    <div class="library-grid" id="library-grid">
        <div class="msg-text">
            <i class="ph-duotone ph-spinner-gap" style="font-size: 32px; animation: spin 1s linear infinite; color: var(--accent);"></i>
            Arranging your bookshelf...
        </div>
    </div>

    <!-- PDF Viewer -->
    <div id="viewer-overlay">
        <!-- Top Header -->
        <div class="viewer-header">
            <button class="btn-action btn-close" onclick="closeViewer()"><i class="ph-bold ph-arrow-left"></i> Library</button>
            
            <div style="display:flex; gap:10px; position:relative;">
                <button class="global-settings-btn" onclick="toggleMenu(event, 'viewer-options-menu')">
                    <i class="ph-bold ph-dots-three-vertical"></i>
                </button>

                <!-- Viewer 3-Dot Menu -->
                <div class="dropdown" id="viewer-options-menu" style="right: 0; top: calc(100% + 8px);">
                    
                    <div class="dropdown-header"><i class="ph-bold ph-list-dashes"></i> Book Outline</div>
                    <div class="dropdown-item" onclick="toggleOutline(event)">
                        <span style="display:flex; align-items:center; gap:6px;"><i class="ph-bold ph-bookmark-simple"></i> Chapters</span>
                        <i class="ph-bold ph-caret-down"></i>
                    </div>
                    <!-- Auto Generated Chapters list -->
                    <div id="outline-container"></div>
                    
                    <div class="dropdown-header" style="margin-top: 10px;"><i class="ph-bold ph-sliders-horizontal"></i> Mode</div>
                    <div class="dropdown-item" onclick="setReadingMode('swipe')">
                        <span style="display:flex; align-items:center; gap:6px;"><i class="ph-bold ph-hand-swipe-left"></i> Single / Swipe</span>
                        <i class="ph-bold ph-check" id="check-swipe" style="color:var(--accent);"></i>
                    </div>
                    <div class="dropdown-item" onclick="setReadingMode('scroll')">
                        <span style="display:flex; align-items:center; gap:6px;"><i class="ph-bold ph-arrows-down-up"></i> Vertical Scroll</span>
                        <i class="ph-bold ph-check" id="check-scroll" style="display:none; color:var(--accent);"></i>
                    </div>
                    
                    <div class="dropdown-header" style="margin-top: 10px;"><i class="ph-bold ph-eye"></i> Comfort</div>
                    <div class="dropdown-item" onclick="toggleEyeCare(event)">
                        <span style="display:flex; align-items:center; gap:6px;"><i class="ph-bold ph-sun-dim"></i> Sepia Eye Care</span>
                        <i class="ph-bold ph-check" id="check-eyecare" style="display:none; color:var(--accent);"></i>
                    </div>
                    
                    <div class="dropdown-header" style="margin-top: 10px;"><i class="ph-bold ph-download-simple"></i> Export</div>
                    <div class="dropdown-item" onclick="downloadCurrentPDF()">
                        <span style="display:flex; align-items:center; gap:6px;">Save to Device</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 🌟 Floating Bottom Nav -->
        <div class="bottom-nav">
            <button class="btn-control" id="prev-page"><i class="ph-bold ph-caret-left"></i></button>
            <span class="page-info"><span id="page-num">0</span> / <span id="page-count">0</span></span>
            <button class="btn-control" id="next-page"><i class="ph-bold ph-caret-right"></i></button>
        </div>
        
        <!-- Canvas -->
        <div class="canvas-container swipe-mode" id="canvas-container">
            <!-- Dynamic Canvases rendered by JS -->
        </div>
    </div>

    <script>
        // ==========================================
        // 🤖 AUTOMATIC GITHUB INFO DETECTION 
        // ==========================================
        let GITHUB_USERNAME = ''; 
        let GITHUB_REPO = '';    
        const FOLDER_NAME = 'pdf'; 

        if (window.location.hostname.includes('github.io')) {
            GITHUB_USERNAME = window.location.hostname.split('.')[0]; 
            const pathParts = window.location.pathname.split('/').filter(part => part.length > 0);
            if (pathParts.length > 0) GITHUB_REPO = pathParts[0]; 
            else GITHUB_REPO = window.location.hostname; 
        }
        // ==========================================

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null, pageNum = 1, autoFitScale = 1.0;
        let readingMode = 'swipe'; 
        let isEyeCareOn = false;
        
        let allPdfs = [];
        let currentFileName = ""; 
        let currentTab = 'all';

        let favorites = JSON.parse(localStorage.getItem('library-favs')) || [];
        let totalReadingMinutes = parseInt(localStorage.getItem('library-read-time')) || 0;
        let readSessionStart = null;

        // 🟢 1. Initialization & UI Setup
        function loadPreferences() {
            const savedTheme = localStorage.getItem('app-theme') || 'default';
            const savedFont = localStorage.getItem('app-font') || 'default';
            document.body.setAttribute('data-theme', savedTheme);
            document.body.setAttribute('data-font', savedFont);
            document.getElementById('theme-select').value = savedTheme;
            document.getElementById('font-select').value = savedFont;
            
            document.getElementById('reading-time-badge').textContent = formatTime(totalReadingMinutes);
            checkHeroBanner();
            updateGlobalHistory(); // 🌟 History properly updated on load
        }

        function formatTime(mins) {
            if(mins < 60) return `${mins} mins`;
            const hrs = Math.floor(mins / 60);
            const rem = mins % 60;
            return `${hrs}h ${rem}m`;
        }

        function changeTheme(theme) { document.body.setAttribute('data-theme', theme); localStorage.setItem('app-theme', theme); }
        function changeFont(font) { document.body.setAttribute('data-font', font); localStorage.setItem('app-font', font); }
        
        // 🌟 The History Function!
        function updateGlobalHistory() {
            const recentBook = localStorage.getItem('recent-book');
            const container = document.getElementById('recent-book-container');
            
            if (recentBook) {
                const page = localStorage.getItem(`page-${recentBook}`) || 1;
                const displayName = recentBook.replace(/\.pdf$/i, '');
                container.innerHTML = `
                    <div class="dropdown-item" onclick="openPdf('${recentBook}')" style="flex-direction:column; align-items:flex-start;">
                        <strong style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width:100%;">${displayName}</strong>
                        <span style="font-size:11px; color:var(--accent); font-weight:600; margin-top:2px;">
                            <i class="ph-bold ph-bookmark-simple"></i> Jump back to Page ${page}
                        </span>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="dropdown-item" style="font-size:12px; color:var(--text-muted); cursor:default;">No books read yet.</div>`;
            }
        }

        function checkHeroBanner() {
            const recentBook = localStorage.getItem('recent-book');
            const hero = document.getElementById('hero-banner');
            
            if (recentBook) {
                const displayName = recentBook.replace(/\.pdf$/i, '');
                const page = parseInt(localStorage.getItem(`page-${recentBook}`)) || 1;
                const total = parseInt(localStorage.getItem(`total-${recentBook}`)) || 1;
                let percent = Math.round((page / total) * 100);
                if(percent > 100) percent = 100;

                document.getElementById('hero-title').textContent = displayName;
                document.getElementById('hero-status').textContent = percent === 100 ? "Completed" : `Page ${page} of ${total} (${percent}%)`;
                document.getElementById('hero-fill').style.width = `${percent}%`;
                hero.style.display = 'block';
            } else {
                hero.style.display = 'none';
            }
        }

        function resumeLastBook() {
            const recentBook = localStorage.getItem('recent-book');
            if(recentBook) openPdf(recentBook);
        }

        function toggleMenu(event, menuId) {
            event.stopPropagation();
            const allMenus = document.querySelectorAll('.dropdown');
            allMenus.forEach(m => { if(m.id !== menuId) m.style.display = 'none'; });
            const target = document.getElementById(menuId);
            target.style.display = target.style.display === 'block' ? 'none' : 'block';
        }
        window.onclick = () => { document.querySelectorAll('.dropdown').forEach(m => m.style.display = 'none'); };

        function toggleEyeCare(event) {
            if(event) event.stopPropagation();
            isEyeCareOn = !isEyeCareOn;
            document.body.classList.toggle('sepia-mode', isEyeCareOn);
            document.getElementById('check-eyecare').style.display = isEyeCareOn ? 'inline-block' : 'none';
        }

        // 🟢 2. Fetch Books
        async function loadLibrary() {
            if (!GITHUB_USERNAME) { document.getElementById('library-grid').innerHTML = `<div class="msg-text"><i class="ph-fill ph-info" style="font-size:32px;"></i> Upload to GitHub Pages to load.</div>`; return; }
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FOLDER_NAME}`);
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                allPdfs = data.filter(file => file.name.toLowerCase().endsWith('.pdf'));
                renderGrid();
            } catch (error) { document.getElementById('library-grid').innerHTML = `<div class="msg-text"><i class="ph-fill ph-warning-circle" style="font-size:32px;"></i> Repo error.</div>`; }
        }

        // 🟢 3. Render Books Grid
        function renderGrid(searchQuery = '') {
            const grid = document.getElementById('library-grid');
            grid.innerHTML = ''; 

            let displayList = allPdfs.filter(file => file.name.toLowerCase().includes(searchQuery.toLowerCase()));
            if (currentTab === 'fav') displayList = displayList.filter(file => favorites.includes(file.name));

            if(displayList.length === 0) { grid.innerHTML = '<div class="msg-text"><i class="ph-duotone ph-books" style="font-size:36px;"></i> No books found.</div>'; return; }

            displayList.forEach((file, index) => {
                const displayName = file.name.replace(/\.pdf$/i, '');
                const isFav = favorites.includes(file.name) ? 'active' : '';
                const savedPage = parseInt(localStorage.getItem(`page-${file.name}`)) || 0;
                const totalPages = parseInt(localStorage.getItem(`total-${file.name}`)) || 0;
                let percent = 0, statusText = "New";
                if(totalPages > 0 && savedPage > 0) { percent = Math.round((savedPage / totalPages) * 100); statusText = percent === 100 ? "Finished" : `${percent}%`; }
                else if (savedPage > 0) { statusText = `Pg ${savedPage}`; }

                const fileUrl = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/${FOLDER_NAME}/${encodeURIComponent(file.name)}`;
                const canvasId = `cover-${index}`;
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="fav-btn ${isFav}" onclick="toggleFav(event, '${file.name}')">🎃</div>
                    <div class="card-cover" onclick="openPdf('${file.name}')"><div class="loading-shimmer"></div><canvas id="${canvasId}"></canvas></div>
                    <div class="card-info" onclick="openPdf('${file.name}')">
                        <div class="card-title" title="${displayName}">${displayName}</div>
                        <div class="progress-wrapper"><div class="progress-text"><span>Progress</span> <span>${statusText}</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%;"></div></div></div>
                    </div>`;
                grid.appendChild(card);
                observer.observe(card); card.dataset.url = fileUrl; card.dataset.cid = canvasId;
            });
        }

        function toggleFav(event, fileName) {
            event.stopPropagation();
            if (favorites.includes(fileName)) favorites = favorites.filter(f => f !== fileName);
            else favorites.push(fileName);
            localStorage.setItem('library-favs', JSON.stringify(favorites));
            if(currentTab === 'fav') renderGrid(document.getElementById('searchInput').value);
            else { event.currentTarget.classList.toggle('active'); }
        }

        function switchTab(tab, element) { currentTab = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); element.classList.add('active'); renderGrid(document.getElementById('searchInput').value); }
        function filterPDFs() { renderGrid(document.getElementById('searchInput').value); }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { const card = entry.target; generateCover(card.dataset.url, card.dataset.cid); observer.unobserve(card); }
            });
        }, { rootMargin: "100px" });

        async function generateCover(url, canvasId) {
            try {
                const pdf = await pdfjsLib.getDocument(url).promise;
                const page = await pdf.getPage(1); const canvas = document.getElementById(canvasId); if(!canvas) return;
                const viewport = page.getViewport({ scale: 0.5 }); canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise; canvas.classList.add('loaded');
            } catch(e) {}
        }

        // 🟢 4. Open PDF & Chapters (Outline)
        function openPdf(fileName) {
            currentFileName = fileName;
            localStorage.setItem('recent-book', fileName);
            updateGlobalHistory(); // 🌟 Update History when a book is opened
            readSessionStart = Date.now(); 
            
            document.getElementById('viewer-overlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            const savedPage = localStorage.getItem(`page-${fileName}`);
            pageNum = savedPage ? parseInt(savedPage) : 1;
            const fileUrl = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/${FOLDER_NAME}/${encodeURIComponent(fileName)}`;
            
            pdfjsLib.getDocument(fileUrl).promise.then(async pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('page-count').textContent = pdfDoc.numPages;
                localStorage.setItem(`total-${fileName}`, pdfDoc.numPages);

                // Auto-fit 
                const firstPage = await pdfDoc.getPage(1);
                const unscaled = firstPage.getViewport({ scale: 1.0 });
                autoFitScale = (document.getElementById('canvas-container').clientWidth - 20) / unscaled.width;
                if(autoFitScale > 1.6) autoFitScale = 1.6; 

                // Extract Chapters
                pdfDoc.getOutline().then(outline => buildOutline(outline));

                renderCurrentMode();
            }).catch(err => { alert("Error loading Book."); closeViewer(); });
        }

        function closeViewer() {
            // Save Reading Time
            if(readSessionStart) {
                const sessionMins = Math.floor((Date.now() - readSessionStart) / 60000);
                totalReadingMinutes += sessionMins;
                localStorage.setItem('library-read-time', totalReadingMinutes);
                document.getElementById('reading-time-badge').textContent = formatTime(totalReadingMinutes);
            }
            document.getElementById('viewer-overlay').style.display = 'none';
            document.body.style.overflow = 'auto'; 
            document.body.classList.remove('focus-mode'); // reset focus mode
            pdfDoc = null; 
            checkHeroBanner();
            renderGrid(document.getElementById('searchInput').value); 
        }

        // Build Table of Contents
        function buildOutline(outline) {
            const container = document.getElementById('outline-container');
            container.innerHTML = '';
            
            if (!outline || outline.length === 0) {
                container.innerHTML = '<div class="outline-item no-chapters">No chapters found in this book.</div>';
                return;
            }

            outline.forEach(item => {
                const div = document.createElement('div');
                div.className = 'outline-item';
                div.textContent = item.title;
                div.onclick = (e) => {
                    e.stopPropagation();
                    if(typeof item.dest === 'string') {
                        pdfDoc.getDestination(item.dest).then(dest => goToDest(dest));
                    } else { goToDest(item.dest); }
                };
                container.appendChild(div);
            });
        }
        
        function toggleOutline(e) { e.stopPropagation(); const c = document.getElementById('outline-container'); c.style.display = c.style.display === 'block' ? 'none' : 'block'; }

        function goToDest(dest) {
            if(!dest) return;
            pdfDoc.getPageIndex(dest[0]).then(idx => {
                pageNum = idx + 1;
                renderCurrentMode();
                document.getElementById('viewer-options-menu').style.display = 'none';
            });
        }

        // 🟢 5. Render Logic
        function setReadingMode(mode) {
            readingMode = mode;
            document.getElementById('check-swipe').style.display = mode === 'swipe' ? 'inline-block' : 'none';
            document.getElementById('check-scroll').style.display = mode === 'scroll' ? 'inline-block' : 'none';
            document.getElementById('canvas-container').classList.toggle('swipe-mode', mode === 'swipe');
            renderCurrentMode();
        }

        function renderCurrentMode() {
            if(!pdfDoc) return;
            if(readingMode === 'swipe') renderSinglePage(pageNum);
            else renderAllPagesContinuous();
        }

        async function renderSinglePage(num) {
            const container = document.getElementById('canvas-container'); container.innerHTML = ''; 
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: autoFitScale });
            const outputScale = window.devicePixelRatio || 1;
            const canvas = document.createElement('canvas'); canvas.className = 'pdf-page-canvas';
            
            canvas.width = Math.floor(viewport.width * outputScale); canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = Math.floor(viewport.width) + "px"; canvas.style.height = Math.floor(viewport.height) + "px";

            container.appendChild(canvas);
            await page.render({ canvasContext: canvas.getContext('2d'), transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null, viewport: viewport }).promise;

            document.getElementById('page-num').textContent = num;
            localStorage.setItem(`page-${currentFileName}`, num);
            updateGlobalHistory(); // 🌟 Update History on Page Change
        }

        async function renderAllPagesContinuous() {
            const container = document.getElementById('canvas-container'); container.innerHTML = ''; 
            for(let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i); const viewport = page.getViewport({ scale: autoFitScale });
                const outputScale = window.devicePixelRatio || 1;
                const canvas = document.createElement('canvas'); canvas.className = 'pdf-page-canvas'; canvas.id = `scroll-page-${i}`;
                canvas.width = Math.floor(viewport.width * outputScale); canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + "px"; canvas.style.height = Math.floor(viewport.height) + "px";
                container.appendChild(canvas);
                page.render({ canvasContext: canvas.getContext('2d'), transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null, viewport: viewport });
            }
            setTimeout(() => { const target = document.getElementById(`scroll-page-${pageNum}`); if(target) target.scrollIntoView({ behavior: 'smooth' }); }, 300);
        }

        // 🟢 6. Interactions: Focus Mode (Tap) & Swipe & Scroll
        const container = document.getElementById('canvas-container');
        
        container.addEventListener('click', (e) => {
            if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'I') {
                document.body.classList.toggle('focus-mode');
            }
        });

        container.addEventListener('scroll', () => {
            if(readingMode !== 'scroll' || !pdfDoc) return;
            const canvases = container.querySelectorAll('.pdf-page-canvas');
            canvases.forEach((c, index) => {
                const rect = c.getBoundingClientRect();
                if(rect.top >= 0 && rect.top <= window.innerHeight / 2) {
                    const currentPg = index + 1;
                    document.getElementById('page-num').textContent = currentPg;
                    localStorage.setItem(`page-${currentFileName}`, currentPg);
                    updateGlobalHistory(); // 🌟 Update History on scroll
                }
            });
        });

        let touchStartX = 0, touchEndX = 0;
        container.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
        container.addEventListener('touchend', e => {
            if(readingMode !== 'swipe') return;
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) { if (pageNum < pdfDoc.numPages) { pageNum++; renderSinglePage(pageNum); } }
            if (touchEndX > touchStartX + 50) { if (pageNum > 1) { pageNum--; renderSinglePage(pageNum); } }
        }, {passive: true});

        document.getElementById('prev-page').addEventListener('click', (e) => { 
            e.stopPropagation(); if (pageNum <= 1) return; pageNum--; 
            if(readingMode === 'swipe') renderSinglePage(pageNum);
            else { const t = document.getElementById(`scroll-page-${pageNum}`); if(t) t.scrollIntoView({ behavior: 'smooth' }); }
        });
        document.getElementById('next-page').addEventListener('click', (e) => { 
            e.stopPropagation(); if (pageNum >= pdfDoc.numPages) return; pageNum++; 
            if(readingMode === 'swipe') renderSinglePage(pageNum);
            else { const t = document.getElementById(`scroll-page-${pageNum}`); if(t) t.scrollIntoView({ behavior: 'smooth' }); }
        });

        function downloadCurrentPDF() { if(currentFileName) window.open(`https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/${FOLDER_NAME}/${encodeURIComponent(currentFileName)}`, '_blank'); }

        loadPreferences(); loadLibrary();
    </script>
</body>
</html>
